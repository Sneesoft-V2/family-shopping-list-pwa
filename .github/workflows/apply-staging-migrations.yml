name: Apply staging database migrations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-staging-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v3
        with:
          version: 3.4.0

      - name: Verify target is not production
        env:
          SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          DEVELOPMENT_SUPABASE_PROJECT_REF: ${{ vars.DEVELOPMENT_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Set SUPABASE_PROJECT_REF in the staging environment."
            exit 1
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Set SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD in the staging environment."
            exit 1
          fi
          if [ -z "$PRODUCTION_SUPABASE_PROJECT_REF" ]; then
            echo "Set PRODUCTION_SUPABASE_PROJECT_REF as a repository variable."
            exit 1
          fi
          if [ -n "$DEVELOPMENT_SUPABASE_PROJECT_REF" ] && [ "$SUPABASE_PROJECT_REF" = "$DEVELOPMENT_SUPABASE_PROJECT_REF" ]; then
            echo "Refusing to apply staging migrations to the development project."
            exit 1
          fi
          if [ "$SUPABASE_PROJECT_REF" = "$PRODUCTION_SUPABASE_PROJECT_REF" ]; then
            echo "Refusing to apply staging migrations to the production project."
            exit 1
          fi

      - name: Apply versioned migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
        run: supabase --yes db push --remote="$SUPABASE_PROJECT_REF"
